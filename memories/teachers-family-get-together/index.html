<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noimageindex, noarchive, nosnippet">
  <meta name="referrer" content="same-origin">
  <title>Teachers &amp; Family Get-together | Jothi Learning</title>
  <link rel="stylesheet" href="./flipbook.css">
</head>
<body>
  <main class="album-shell" aria-labelledby="album-title">
    <header class="album-header">
      <p class="eyebrow">Jothi Learning · Private memories</p>
      <h1 id="album-title">Teachers &amp; Family Get-together</h1>
      <p class="event-date">7 November 2026</p>
    </header>

    <section class="viewer" aria-label="Photo flipbook">
      <div class="book-stage" id="book-stage" tabindex="0" aria-describedby="book-help">
        <div class="book" id="book" aria-live="polite">
          <article class="page cover" id="cover-page">
            <div class="cover-logo">
              <span class="cover-logo-panel"><img src="./jothi-shield-logo.png" alt="Jothi Learning"></span>
              <span class="cover-logo-wordmark" aria-hidden="true"><span>JOTHI</span><span>LEARNING</span></span>
            </div>
            <h2>Teachers &amp;<br>Family Get-together</h2>
            <span>7 November 2026</span>
          </article>
          <article class="page photo-page is-hidden" id="photo-page">
            <img id="photo" alt="" width="1086" height="1448">
            <p class="photo-caption" id="photo-caption"></p>
          </article>
          <div class="turn-leaf is-hidden" id="turn-leaf" aria-hidden="true"><img id="turn-image" alt=""></div>
        </div>
      </div>
      <p class="sr-only" id="book-help">Use the previous and next buttons, left and right arrow keys, or a horizontal swipe to turn pages.</p>

      <nav class="controls" aria-label="Flipbook controls">
        <a class="back-link" href="https://jothi.uk/">← Back to Jothi</a>
        <button class="control-button" type="button" id="previous" aria-label="Previous page">←<span>Previous</span></button>
        <output class="sr-only" id="page-count" aria-live="polite">Cover · 0 of 14 photos</output>
        <button class="control-button" type="button" id="next" aria-label="Next page"><span>Next</span>→</button>
        <button class="icon-button" type="button" id="thumbnails" aria-expanded="false" aria-controls="thumbnail-drawer">☷<span class="sr-only">Open thumbnail navigation</span></button>
        <button class="icon-button" type="button" id="fullscreen" aria-label="View flipbook full screen">⛶</button>
      </nav>
    </section>

    <aside class="thumbnail-drawer" id="thumbnail-drawer" aria-label="Choose a page" hidden>
      <div class="drawer-heading"><h2>Pages</h2><button type="button" id="close-thumbnails" aria-label="Close thumbnail navigation">×</button></div>
      <div class="thumbnail-grid" id="thumbnail-grid"></div>
    </aside>
  </main>
  <noscript><p class="no-script">This flipbook needs JavaScript to display its pages.</p></noscript>
  <script type="module" src="./flipbook.js"></script>
</body>
</html>
