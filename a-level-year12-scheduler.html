<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,follow" />
  <meta name="theme-color" content="#10233f" />
  <title>Year 12 A-Level Maths | Lesson Schedule 2026–27</title>
  <meta name="description" content="Year 12 A-Level Maths lesson schedule for the 2026–27 programme." />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="a-level-scheduler.css" />
</head>
<body class="scheduler-page">
  <a class="skip-link" href="#main">Skip to scheduler</a>

  <header class="scheduler-header">
    <div class="wrap scheduler-header-inner">
      <a class="brand" href="index.html" aria-label="Jothi Learning home">
        <img src="Logo%202026.png" alt="Jothi Learning logo" width="90" height="90" />
        <span class="brand-lockup">
          <span class="brand-name">JOTHI</span>
          <span class="brand-subline">LEARNING</span>
          <span class="brand-tag">Serious teaching. Visible progress.</span>
        </span>
      </a>
    </div>
  </header>

  <main id="main">
    <section class="scheduler-intro">
      <div class="wrap">
        <p class="scheduler-eyebrow">Year 12 A-Level Maths</p>
      </div>
    </section>

    <section class="wrap scheduler-workspace" aria-labelledby="schedule-heading">
      <section class="schedule-panel" aria-labelledby="schedule-heading">
        <div class="panel-heading schedule-heading">
          <div>
            <h1 id="schedule-heading">Lesson Schedule 2026–27</h1>
          </div>
          <p class="generation-note" id="generation-note" aria-live="polite"></p>
        </div>

        <div id="scheduler-error" class="scheduler-error" role="alert" hidden></div>
        <div id="batch-tabs"></div>
      </section>

      <details class="staff-controls">
        <summary>Staff schedule controls</summary>
        <form class="setup-panel" id="scheduler-setup">
          <div class="panel-heading">
            <p>Adjust programme dates and batch timings.</p>
            <button class="scheduler-button" type="submit">Generate / Regenerate Schedule</button>
          </div>

          <div class="setup-grid setup-grid-programme">
            <label>Programme start date<input id="programme-start" name="programme_start" type="date" required /></label>
            <label>Target completion date<input id="target-completion" name="target_completion" type="date" required /></label>
          </div>

          <div id="closure-controls" class="setup-section"></div>
          <div id="batch-controls" class="setup-section"></div>
          <div id="acceleration-controls" class="setup-section"></div>
        </form>
      </details>
    </section>
  </main>

  <footer class="scheduler-footer">
    <div class="wrap">
      <p><strong>Jothi Learning</strong> · Year 12 A-Level Maths lesson schedule</p>
    </div>
  </footer>

  <dialog class="event-editor" id="event-editor" aria-labelledby="event-editor-title">
    <form id="event-edit-form">
      <div class="event-editor-heading">
        <div>
          <p class="section-kicker">Schedule adjustment</p>
          <h2 id="event-editor-title">Reschedule event</h2>
        </div>
        <button class="event-editor-close" type="button" data-editor-action="cancel" aria-label="Close reschedule editor">×</button>
      </div>

      <dl class="event-editor-context">
        <div><dt>Event</dt><dd id="event-editor-type"></dd></div>
        <div><dt>Lesson</dt><dd id="event-editor-lesson"></dd></div>
      </dl>

      <div class="event-editor-fields">
        <label>Date<input id="event-override-date" type="date" required /></label>
        <label>Start time<input id="event-override-start" type="time" required /></label>
        <label>End time<input id="event-override-end" type="time" required /></label>
      </div>

      <div class="event-editor-errors" id="event-editor-errors" role="alert" hidden></div>
      <div class="event-editor-warnings" id="event-editor-warnings" hidden>
        <ul></ul>
        <label class="event-warning-confirm">
          <input id="event-warning-confirm" type="checkbox" />
          I understand the warning and want to save this change.
        </label>
      </div>

      <div class="event-editor-actions">
        <button class="scheduler-button" type="submit">Save</button>
        <button class="event-editor-secondary" type="button" data-editor-action="cancel">Cancel</button>
        <button class="event-editor-reset" type="button" data-editor-action="reset">Reset to original schedule</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="a-level-scheduler.js"></script>
</body>
</html>
